name: Watch downloads

on:
  schedule:
    - cron: '0 6 * * 0'   # every Sunday, 06:00 UTC (09:00 Israel)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read the version numbers on every official download page
        run: node scripts/watch-downloads.js
      - name: Commit when something changed
        run: |
          if git diff --quiet data/downloads-watch.json; then echo "no change"; exit 0; fi
          git config user.name "camlist-bot"
          git config user.email "camlist-bot@users.noreply.github.com"
          git add data/downloads-watch.json
          git commit -m "chore: weekly downloads watch $(date -u +%F)"
          git push
